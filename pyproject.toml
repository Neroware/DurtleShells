[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durtleshells"
version = "0.1.0"
description = "A Vim-flavoured terminal WaniKani client with a flick keyboard, inspired by Smouldering Durtles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Raoul Zebisch" }]
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
durtleshells = "durtleshells.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/durtleshells"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
